      # Stages 6 through 13.2 previously had no CI gate of any kind. That is
      # where decay was found: `stage12-3-test` and `stage12-5-test` could not
      # compile at all, so neither gate had been runnable, with nothing watching.
      # A gate that cannot compile is a gate nobody is running, so each step
      # below lints its exact feature before booting it.
      - name: Stage 10.8-11.5 runtime 1/2/4-core acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          for stage in 10.8 10.9 11.1 11.2 11.3 11.4 11.5; do
            feature="stage${stage/./-}-test"
            cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features "$feature" -- -D warnings
