stage19-10-test = ["qemu-test", "kernel/stage19-10-test"]
stage19-11-test = ["qemu-test", "kernel/stage19-11-test"]
stage19-12-test = ["qemu-test", "kernel/stage19-12-test"]
stage19-13-test = ["qemu-test", "kernel/stage19-13-test"]
stage1-5-test = ["qemu-test", "kernel/stage1-5-test"]

[profile.dev]
panic = "abort"

[package]
name = "wovenhat-os"
version = "0.8.0"
edition = "2024"

[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
kernel = { package = "wovenhat-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = { version = "0.11.17", default-features = false, features = ["uefi"] }

[dev-dependencies]
unicode-normalization = { version = "0.1.25", default-features = false }
# The display stack's presentation path takes the bootloader's framebuffer
# description, so host tests of compositing need the same type the kernel sees
# rather than a stand-in that could drift from it.
bootloader_api = "0.11.17"
[lints.rust]
warnings = "deny"
