name: WovenHat-OS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test Kernel (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Add Target
        run: rustup target add x86_64-unknown-none

      - name: Build Kernel
        run: cargo build --target x86_64-unknown-none --verbose

      - name: Run QEMU Smoke Test
        run: |
          qemu-system-x86_64 -smp 2 -m 256M -display none -no-reboot -no-shutdown -d int -D qemu.log &
          QEMU_PID=$!
          sleep 3
          kill $QEMU_PID || true
          cat qemu.log || true
