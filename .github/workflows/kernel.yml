name: kernel

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: clippy,rust-src,llvm-tools-preview
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 ovmf
      - name: Lint, host regressions, and 1/2/4-core boot matrix
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          echo "Installed OVMF firmware files:"
          find /usr/share/OVMF -maxdepth 1 -type f -name '*.fd' -printf '%f\n' | sort
          ovmf_code=
          ovmf_vars=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            [ -f "$candidate" ] || continue
            vars_name="${variant/CODE/VARS}"
            vars_candidate="/usr/share/OVMF/$vars_name"
            if [ -f "$vars_candidate" ]; then
              ovmf_code="$candidate"
              ovmf_vars="$vars_candidate"
              break
            fi
          done
          test -x "$qemu"
          if [ -z "$ovmf_code" ] || [ -z "$ovmf_vars" ]; then
            echo "::error::No matched OVMF CODE/VARS pair found"
            exit 1
          fi
          "$qemu" --version
          echo "OVMF CODE: $ovmf_code"
          echo "OVMF VARS: $ovmf_vars"
          sha256sum "$ovmf_code" "$ovmf_vars"
          python3 scripts/test-release.py --qemu "$qemu" --firmware "$ovmf_code" --firmware-vars "$ovmf_vars"
      - name: Stage 1–19 closure baseline and source-integrity preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Closure baseline: $(git rev-parse HEAD)"
          test -f docs/stage1-19-closure-gate.md
          git diff --exit-code -- kernel/src/storage_manager.rs
          python3 - <<'PY'
          from pathlib import Path
          source = Path("kernel/src/storage_manager.rs").read_text()
          required = "let i = m.iter_mut().position(|x| x.is_none())?;"
          if required not in source:
              raise SystemExit("::error::Storage mount slot declaration missing before acceptance")
          print("Storage mount source-integrity preflight passed")
          PY
      - name: Stage 1-5 production software gate 1/2/4-core acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          cargo check -p wovenhat-kernel --target x86_64-unknown-none --features stage1-5-test
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features stage1-5-test -- -D warnings
          for cpu in 1 2 4; do
            python3 scripts/test-stage10-runtime.py --stage 1-5 --cpus "$cpu" --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
          done
      - name: Stage 6 SMP hotplug and legacy IRQ acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features stage6-hotplug-test -- -D warnings
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features legacy-pic-test -- -D warnings
          for cpu in 2 4; do
            python3 scripts/test-stage6-hotplug.py --cpus "$cpu" --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
          done
          python3 scripts/test-memory-qemu.py --cpus 1 --legacy-irq --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
      - name: Preserve core-foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-foundation-evidence
          if-no-files-found: ignore
          path: |
            target/release-validation/
            audit-artifacts/
            target/*regression-*/serial.log
            target/*regression-*/qemu.log
            target/hello-gui-*/serial.log

