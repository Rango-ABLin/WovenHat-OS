[package]
name = "wovenhat-kernel"
version = "0.8.0"
edition = "2021"

[features]
physical-probe = []
qemu-test = []
stage6-hotplug-test = ["qemu-test"]
network-test = ["qemu-test"]
legacy-pic-test = ["qemu-test"]
stage10-4-test = ["qemu-test"]
stage10-5-test = ["qemu-test"]
stage10-6-test = ["qemu-test"]
stage10-7-test = ["qemu-test"]
stage10-8-test = ["qemu-test"]
stage10-9-test = ["qemu-test"]
stage11-1-test = ["qemu-test"]
stage11-2-test = ["qemu-test"]
stage11-3-test = ["qemu-test"]
stage11-4-test = ["qemu-test"]
stage11-5-test = ["qemu-test"]
stage12-1-test = ["qemu-test"]
stage12-2-test = ["qemu-test"]
stage12-3-test = ["qemu-test"]
stage12-4-test = ["qemu-test"]
# Stage 12 gates must not chain: each stage's self-test block ends the boot with
# `qemu_test_exit_success()`, so enabling an earlier stage's feature would exit
# before the later block runs. Shared module dependencies are expressed with
# `cfg(any(..))` on the module instead.
stage12-5-test = ["qemu-test"]
stage13-1-test = ["qemu-test"]
stage13-2-test = ["qemu-test"]
stage13-3-test = ["qemu-test"]
stage13-4-test = ["qemu-test"]
stage13-5-test = ["qemu-test"]
stage13-6-test = ["qemu-test"]
stage13-7-test = ["qemu-test"]
stage13-8-test = ["qemu-test"]
stage13-9-test = ["qemu-test"]
stage13-10-test = ["qemu-test"]
stage14-1-test = ["network-test"]
stage14-2-test = ["network-test", "stage14-1-test"]
stage14-3-test = ["network-test", "stage14-2-test"]
stage14-4-test = ["network-test", "stage14-3-test"]
stage14-5-test = ["network-test", "stage14-4-test"]
stage14-5b-test = ["stage14-5-test"]
stage14-5c-test = ["stage14-5b-test"]
stage14-5d-test = ["stage14-5c-test", "stage13-9-test"]
# WovenFS native on-disk filesystem.
stage15-1-test = ["qemu-test"]
# WovenFS on a real block device through the ATA driver, visible in the VFS.
stage15-2-test = ["qemu-test"]
# An application built outside the kernel, loaded from the filesystem.
stage16-1-test = ["qemu-test"]
# Full printable-ASCII font and text layout.
stage17-1-test = ["qemu-test"]
# Owner-bound client surface registry for userspace graphics.
stage18-1-test = ["qemu-test"]
# A userspace app that drives the graphics syscalls end-to-end.
stage18-2-test = ["qemu-test"]
# Kernel-held compositor surface and screen blit syscalls.
stage19-1-test = ["qemu-test"]
# A userspace app that paints its window onto the compositor.
stage19-2-test = ["qemu-test"]
# Compositor presentation to the framebuffer and display ownership.
stage19-3-test = ["qemu-test"]
# Compositor authority: DisplayIo, the exclusive lease and handle binding.
stage19-4-test = ["qemu-test"]
# Input focus routed to the compositor lease holder.
stage19-5-test = ["qemu-test"]
# Event-driven input wait for the focus holder.
stage19-6-test = ["qemu-test"]
# Client surfaces delegated to a separate compositor process.
stage19-7-test = ["qemu-test"]
# One sleep over input and IPC.
stage19-8-test = ["qemu-test"]
# Client damage notification and damage-only compositing.
stage19-9-test = ["qemu-test"]
# Compositor follows the framebuffer; every framebuffer writer behind one lock.
stage19-10-test = ["qemu-test"]
# A userspace window manager: stacking, raise, focus and input routing.
stage19-11-test = ["qemu-test"]
stage1-5-test = ["qemu-test"]

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.10"

smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
unicode-normalization = { version = "0.1.25", default-features = false }
poly1305 = { version = "0.7.2", features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
[lints.rust]
warnings = "deny"
