        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features stage15-1-test -- -D warnings
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features stage15-2-test -- -D warnings
          for cpu in 1 2 4; do
            python3 scripts/test-stage10-runtime.py --stage 15.1 --cpus "$cpu" --timeout 240 --qemu "$qemu" --firmware "$ovmf_code"
          done
          # WovenFS on a block device needs the legacy ATA channel, which the
          # q35 machine the other runtime gates use does not expose.
          for cpu in 1 2 4; do
            python3 scripts/test-wovenfs-device.py --cpus "$cpu" --timeout 300 --qemu "$qemu" --firmware "$ovmf_code"
          done
      - name: Default and physical-probe configuration lint
        shell: bash
        run: |
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features physical-probe -- -D warnings
          cargo clippy -p libwoven --target x86_64-unknown-none -- -D warnings
          cargo clippy --all-targets -- -D warnings
      - name: Preserve wovenfs-lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wovenfs-lint-evidence
          if-no-files-found: ignore
          path: |
            target/release-validation/
            audit-artifacts/
            target/*regression-*/serial.log
            target/*regression-*/qemu.log
