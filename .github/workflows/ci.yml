name: WovenHat-OS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & QEMU Integration Test (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Add Target
        run: rustup target add x86_64-unknown-none

      - name: Build Kernel
        run: cargo build --target x86_64-unknown-none --verbose

      - name: Run QEMU Integration Tests
        run: |
          timeout 10 qemu-system-x86_64 \
            -smp 2 \
            -m 256M \
            -display none \
            -no-reboot \
            -no-shutdown \
            -serial file:qemu_output.log || true

          cat qemu_output.log || echo "No serial output captured"

          if grep -q "ALL INTEGRATION TESTS PASSED SUCCESSFULLY" qemu_output.log; then
            echo "::notice::WovenHat-OS Integration Tests Passed Successfully!"
          else
            echo "::warning::Integration test signature not detected in serial log."
          fi
