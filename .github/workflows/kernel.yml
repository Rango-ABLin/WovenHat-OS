name: kernel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: clippy,rust-src,llvm-tools-preview
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 ovmf
      - name: Lint, host regressions, and 1/2/4-core boot matrix
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=/usr/share/OVMF/OVMF_CODE.fd
          ovmf_vars=/usr/share/OVMF/OVMF_VARS.fd
          test -x "$qemu"
          test -f "$ovmf_code"
          test -f "$ovmf_vars"
          "$qemu" --version
          echo "OVMF CODE: $ovmf_code"
          echo "OVMF VARS: $ovmf_vars"
          sha256sum "$ovmf_code" "$ovmf_vars"
          python3 scripts/test-release.py --qemu "$qemu" --firmware "$ovmf_code" --firmware-vars "$ovmf_vars"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            target/release-validation/
            target/memory-regression-*/serial.log
            target/storage-regression-*/serial.log
            target/network-regression-*/serial.log
            target/network-regression-*/qemu.log
