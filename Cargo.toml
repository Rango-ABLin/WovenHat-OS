[workspace]
resolver = "3"
members = ["kernel", "libwoven"]
# Applications are excluded deliberately. They are freestanding Ring-3 ELF
# images with their own linker script and link flags, so a host-targeted
# workspace build must not try to compile them.
exclude = ["vendor/bootloader", "apps/hello", "apps/hello-gui", "apps/woven-shell"]

[patch.crates-io]
bootloader = { path = "vendor/bootloader" }

