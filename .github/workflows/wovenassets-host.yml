name: WovenAssets Host Qualification
on:
  pull_request:
    paths:
      - 'tools/wovenassets/**'
      - '.github/workflows/wovenassets-host.yml'
  push:
    paths:
      - 'tools/wovenassets/**'
      - '.github/workflows/wovenassets-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated host tooling dependencies
        run: python -m pip install -r tools/wovenassets/requirements-host.txt
      - name: Execute host-side graphics tests
        run: python -m unittest discover -s tools/wovenassets -p 'test_*.py' -v
      - name: Validate WovenUI light/dark tokens
        run: python tools/wovenassets/validate_tokens.py tools/wovenassets/wovenui-tokens.json
      - name: Verify fixture integrity
        run: python -m json.tool tools/wovenassets/multilingual-text-cases.json > /dev/null

# This workflow only qualifies host tooling. It does not establish a guest
# graphics PASS, QEMU 1/2/4-CPU acceptance or hardware certification.
