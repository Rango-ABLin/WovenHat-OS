# WovenHat OS Syscall Definitions
# This file defines syscalls with type-safe parameters and auto-generates bindings

[metadata]
version = "1.0"
description = "Type-safe syscall definitions for code generation"

# Completion Port Syscalls (Stage 10.8)
[syscalls.CompletionPortCreate]
number = 82
description = "Create a completion port for the current process"
returns = "u64"
parameters = []

[syscalls.CompletionPortClose]
number = 83
description = "Close an owned completion port"
returns = "i32"
parameters = [
    { name = "port", type = "u64", description = "Port handle" }
]

[syscalls.CompletionPortAssociate]
number = 84
description = "Associate an async operation with a completion port"
returns = "i32"
parameters = [
    { name = "operation", type = "u64", description = "Operation handle" },
    { name = "port", type = "u64", description = "Port handle" },
    { name = "cookie", type = "u64", description = "Application cookie" }
]

[syscalls.CompletionPortPoll]
number = 85
description = "Non-blocking poll of completion port events"
returns = "u64"
parameters = [
    { name = "port", type = "u64", description = "Port handle" },
    { name = "destination", type = "usize", description = "User buffer pointer" },
    { name = "capacity", type = "u64", description = "Max events (1-8)" }
]

[syscalls.CompletionPortWait]
number = 86
description = "Block until at least one event is available or timeout expires"
returns = "u64"
parameters = [
    { name = "port", type = "u64", description = "Port handle" },
    { name = "destination", type = "usize", description = "User buffer pointer" },
    { name = "options", type = "usize", description = "Options pointer (capacity, timeout)" }
]

# Async Operation Syscalls (Stage 10.3)
[syscalls.AsyncCreate]
number = 64
description = "Create an asynchronous operation handle"
returns = "u64"
parameters = [
    { name = "class", type = "u32", description = "AsyncClass enum value" }
]

[syscalls.AsyncPoll]
number = 65
description = "Non-blocking poll of async operation completion"
returns = "u64"
parameters = [
    { name = "handle", type = "u64", description = "Operation handle" },
    { name = "completion", type = "usize", description = "User buffer for Completion struct" }
]

[syscalls.AsyncCancel]
number = 67
description = "Cancel an async operation"
returns = "i32"
parameters = [
    { name = "handle", type = "u64", description = "Operation handle" }
]

