parameters = [
    { name = "status", type = "i32", description = "Exit status code" }
]

[syscalls.Getpid]
number = 4
description = "Get current process ID"
returns = "u64"
parameters = []

[syscalls.Yield]
number = 7
description = "Yield to scheduler"
returns = "i32"
parameters = []

[syscalls.Getticks]
number = 31
description = "Get current monotonic tick count"
returns = "u64"
parameters = []

# I/O Syscalls
[syscalls.Read]
number = 0
description = "Read from a file descriptor"
