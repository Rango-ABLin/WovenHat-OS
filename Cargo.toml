[profile.dev]
panic = "abort"

# Boot measurement hashes the complete kernel ELF before device/task startup.
# Debug software SHA-256 otherwise dominates TCG boot time as debug ELF grows.
# Preserve measurement coverage and crypto checks with the normal gate bounds.
[profile.dev.package.sha2]
opt-level = 3

[package]
name = "wovenhat-os"
version = "0.8.0"
edition = "2024"

[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
kernel = { package = "wovenhat-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = { version = "0.11.17", default-features = false, features = ["uefi"] }
ed25519-compact = { version = "2.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[dev-dependencies]
unicode-normalization = { version = "0.1.25", default-features = false }
# The display stack's presentation path takes the bootloader's framebuffer
# description, so host tests of compositing need the same type the kernel sees
# rather than a stand-in that could drift from it.
bootloader_api = "0.11.17"
[lints.rust]
warnings = "deny"
