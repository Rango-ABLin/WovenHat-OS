# Its own workspace root: this crate links as a Ring-3 program and must not
# inherit the kernel workspace build settings.
[workspace]

[package]
name = "wovenhat-woven-shell"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wovenhat-woven-shell"
path = "src/main.rs"

[dependencies]
libwoven = { path = "../../libwoven" }

[profile.release]
panic = "abort"
# Rendering and the unchanged 100,000-round credential KDF are latency-sensitive
# under software emulation; optimize execution while retaining stripped/LTO code.
opt-level = 2
lto = true
# The image must fit the bounded VFS executable capacity; symbols are not
# needed to run it.
strip = "symbols"

[profile.dev]
panic = "abort"
