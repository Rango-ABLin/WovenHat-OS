[package]
name = "woven-installer"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "woven-installer"
path = "src/main.rs"
test = false

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "=0.38.0", features = ["alloc", "global_allocator", "panic_handler"] }

[profile.release]
panic = "abort"

[lints.rust]
warnings = "deny"
