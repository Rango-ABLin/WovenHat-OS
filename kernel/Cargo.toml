[package]
name = "wovenhat_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
x86_64 = { version = "0.14.13", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
spin = "0.9.8"
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
volatile = "0.4.6"
bootloader_api = "0.11.7"
getrandom = { version = "0.2", features = ["rdrand"] }
smoltcp = { version = "0.10.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-raw", "socket-udp", "socket-tcp"] }
