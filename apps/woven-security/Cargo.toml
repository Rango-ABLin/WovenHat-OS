[workspace]

[package]
name = "wovenhat-security"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wovenhat-security"
path = "src/main.rs"
test = false

[dependencies]
libwoven = { path = "../../libwoven" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
