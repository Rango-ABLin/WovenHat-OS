[package]
name = "wovenhat-kernel"
version = "0.8.0"
edition = "2021"

[[bin]]
name = "wovenhat-kernel"
path = "src/main.rs"
# The kernel is a freestanding no_std image. Cargo's host test harness cannot
# link it: it would provide a second panic/allocator implementation and apply
# `cfg(test)` to only part of the image. Keep host tests in the explicit
# integration crates and compile the kernel image through its normal target.
test = false
bench = false

[features]
physical-probe = []
physical-wifi = ["physical-probe", "stage13-9-test"]
qemu-test = []
stage6-hotplug-test = ["qemu-test"]
network-test = ["qemu-test"]
legacy-pic-test = ["qemu-test"]
stage10-4-test = ["qemu-test"]
stage10-5-test = ["qemu-test"]
stage10-6-test = ["qemu-test"]
stage10-7-test = ["qemu-test"]
stage10-8-test = ["qemu-test"]
stage10-9-test = ["qemu-test"]
stage11-1-test = ["qemu-test"]
stage11-2-test = ["qemu-test"]
# Run the compiled libwoven fixture first, then the unchanged Stage 11.2 gate.
stage11-exit-status-test = ["stage11-2-test"]
stage11-3-test = ["qemu-test"]
stage11-4-test = ["qemu-test"]
stage11-5-test = ["qemu-test"]
# Execute unmodified compiler output before the unchanged loader gate exits.
stage11-compiler-test = ["stage11-5-test"]
stage11-tls-test = ["stage11-2-test"]
stage11-aslr-test = ["stage11-2-test"]
stage12-1-test = ["qemu-test"]
stage12-2-test = ["qemu-test"]
stage12-3-test = ["qemu-test"]
stage12-4-test = ["qemu-test"]
# Stage 12 gates must not chain: each stage's self-test block ends the boot with
# `qemu_test_exit_success()`, so enabling an earlier stage's feature would exit
# before the later block runs. Shared module dependencies are expressed with
# `cfg(any(..))` on the module instead.
stage12-5-test = ["qemu-test"]
stage13-1-test = ["qemu-test"]
stage13-2-test = ["qemu-test"]
stage13-3-test = ["qemu-test"]
stage13-4-test = ["qemu-test"]
stage13-5-test = ["qemu-test"]
stage13-6-test = ["qemu-test"]
stage13-7-test = ["qemu-test"]
stage13-8-test = ["qemu-test"]
stage13-9-test = ["qemu-test"]
stage13-10-test = ["qemu-test"]
# Boot-time driver bring-up: the driver manager binds storage, USB and audio.
stage13-12-test = ["qemu-test"]
# USB keyboards and mice into WovenInput through an interrupt-driven xHCI
# worker. Builds on 13.12 bring-up; its gate block runs before 13.12's.
stage13-13-test = ["qemu-test", "stage13-12-test"]
# Storage mounted from NVMe or AHCI through the selectable root block device.
stage13-14-test = ["qemu-test", "stage13-12-test"]
# WovenAudio playback for userspace: AudioPlayback capability, syscalls
# 203-205, interrupt-driven HDA completion.
stage13-15-test = ["qemu-test", "stage13-12-test"]
# Report-protocol HID devices: tablets, digitizers, game controllers.
stage13-16-test = ["qemu-test", "stage13-12-test"]
# Disks WovenHat does not own (no WOVENHAT/WOVENLOG volume) are read-only.
stage13-17-test = ["qemu-test", "stage13-12-test"]
# USB mass storage (Bulk-Only Transport, SCSI) as a block device.
stage13-18-test = ["qemu-test", "stage13-12-test"]
# The boot's log kept on the WovenHat USB stick's WOVENLOG partition.
stage13-19-test = ["qemu-test", "stage13-12-test"]
# ACPI power-off (S5); 13.20b resets instead.
stage13-20-test = ["qemu-test", "stage13-12-test"]
stage13-20b-test = ["qemu-test", "stage13-20-test"]
# The WovenShell desktop as the session: F12 console, power off.
stage20-15-test = ["qemu-test", "stage13-12-test"]
# Deterministic Change-PIN UI acceptance uses the production identity/session
# capability boundary and the same kernel-injected pointer/keyboard path as
# the earlier desktop tests.
stage24-59-test = ["qemu-test", "system-apps"]
stage14-1-test = ["network-test"]
stage14-2-test = ["network-test", "stage14-1-test"]
stage14-3-test = ["network-test", "stage14-2-test"]
stage14-4-test = ["network-test", "stage14-3-test"]
stage14-5-test = ["network-test", "stage14-4-test"]
stage14-5b-test = ["stage14-5-test"]
stage14-5c-test = ["stage14-5b-test"]
stage14-5d-test = ["stage14-5c-test", "stage13-9-test"]
# WovenFS native on-disk filesystem.
stage15-1-test = ["qemu-test"]
# WovenFS on a real block device through the ATA driver, visible in the VFS.
stage15-2-test = ["qemu-test"]
stage15-3-test = ["qemu-test"]
stage15-4-test = ["qemu-test"]
secure-boot = []
stage15-5-test = ["qemu-test", "secure-boot"]
stage15-6-test = ["qemu-test"]
stage15-7-test = ["qemu-test"]
stage15-8-test = ["qemu-test"]
stage15-9-test = ["qemu-test"]
stage27-1-test = ["qemu-test"]
# Durable update records use the accepted native WovenFS device transaction
# boundary; the Stage 27.2 gate runs before the inherited Stage 15.2 exit.
stage27-2-test = ["qemu-test", "stage15-2-test"]
# An application built outside the kernel, loaded from the filesystem.
stage16-1-test = ["qemu-test"]
# Three signed system applications installed through one bounded catalog plan.
stage19-app-catalog-test = ["qemu-test"]
# Production image build: install the signed system-app catalog during boot.
system-apps = []
# Disposable live-hardware demo: system apps plus documented sample accounts.
hardware-demo = ["system-apps"]
# Full printable-ASCII font and text layout.
stage17-1-test = ["qemu-test"]
# Owner-bound client surface registry for userspace graphics.
stage18-1-test = ["qemu-test"]
# A userspace app that drives the graphics syscalls end-to-end.
stage18-2-test = ["qemu-test"]
# Kernel-held compositor surface and screen blit syscalls.
stage19-1-test = ["qemu-test"]
# A userspace app that paints its window onto the compositor.
stage19-2-test = ["qemu-test"]
# Compositor presentation to the framebuffer and display ownership.
stage19-3-test = ["qemu-test"]
# Compositor authority: DisplayIo, the exclusive lease and handle binding.
stage19-4-test = ["qemu-test"]
# Input focus routed to the compositor lease holder.
stage19-5-test = ["qemu-test"]
# Event-driven input wait for the focus holder.
stage19-6-test = ["qemu-test"]
# Client surfaces delegated to a separate compositor process.
stage19-7-test = ["qemu-test"]
# One sleep over input and IPC.
stage19-8-test = ["qemu-test"]
# Client damage notification and damage-only compositing.
stage19-9-test = ["qemu-test"]
# Compositor follows the framebuffer; every framebuffer writer behind one lock.
stage19-10-test = ["qemu-test"]
# A userspace window manager: stacking, raise, focus and input routing.
stage19-11-test = ["qemu-test"]
# PS/2 pointer input and IRQ-time keystroke delivery.
stage19-12-test = ["qemu-test"]
# Translucent windows and shadows.
stage19-13-test = ["qemu-test"]
# Integer display scaling and paced animation.
stage19-14-test = ["qemu-test"]
# WovenShell desktop: wallpaper, taskbar and clock.
stage20-1-test = ["qemu-test"]
# WovenShell desktop: windows, taskbar entries, tray and notifications.
stage20-2-test = ["qemu-test"]
# WovenStart: the application launcher.
stage20-3-test = ["qemu-test"]
# Windows that move and close; budgeted client surfaces.
stage20-4-test = ["qemu-test"]
# Depth: window shadows and elevation through region blends.
stage20-5-test = ["qemu-test"]
# Translucent panel, toast and pointer overlays over windows.
stage20-6-test = ["qemu-test"]
# Physics-based animation: windows fade in on a spring.
stage20-7-test = ["qemu-test"]
# Tiling: resize protocol, snap to edges, master-and-stack layout.
stage20-8-test = ["qemu-test"]
# Notification Center: history, unread badge, panel, clear.
stage20-9-test = ["qemu-test"]
# Quick Settings: display scale, Do Not Disturb, tiling.
stage20-10-test = ["qemu-test"]
# Lock screen: PIN held by the shell, input withheld from applications.
stage20-11-test = ["qemu-test"]
# Login: local accounts with salted SHA-256 PIN hashes, sign-in screen.
stage20-12-test = ["qemu-test"]
# Workspaces: switcher, F3/F4, per-workspace windows.
stage20-13-test = ["qemu-test"]
# Two monitors: modern virtio-pci transport and a multi-scanout virtio-gpu.
stage20-14-test = ["qemu-test"]
# The desktop across two monitors.
stage20-14b-test = ["qemu-test"]
stage21-1-test = ["qemu-test"]
stage21-2-test = ["qemu-test"]
stage21-3-test = ["qemu-test"]
stage21-4-test = ["qemu-test"]
stage21-5-test = ["qemu-test"]
stage21-6-test = ["qemu-test", "stage15-2-test"]
stage21-7-test = ["qemu-test", "stage15-2-test"]
stage21-8-test = ["qemu-test", "stage15-2-test"]
stage21-9-test = ["qemu-test", "stage15-2-test"]
stage21-10-test = ["qemu-test", "stage15-2-test"]
stage21-11-test = ["qemu-test", "stage15-2-test"]
stage22-1-test = ["qemu-test", "stage15-2-test"]
stage22-2-test = ["qemu-test", "stage15-2-test"]
stage22-3-test = ["qemu-test", "stage15-2-test"]
# Ring-3 WovenPackage mutations use the accepted native WovenFS authority.
stage22-5-test = ["qemu-test", "stage15-2-test"]
stage23-1-test = ["qemu-test"]
stage23-2-test = ["qemu-test"]
stage23-3-test = ["qemu-test"]
stage23-4-test = ["qemu-test"]
stage23-5-test = ["qemu-test"]
stage23-6-test = ["qemu-test"]
stage23-7-test = ["qemu-test"]
stage24-1-test = ["qemu-test"]
stage24-2-test = ["qemu-test"]
stage24-3-test = ["qemu-test"]
stage24-4-test = ["qemu-test"]
stage24-5-test = ["qemu-test"]
stage1-5-test = ["qemu-test"]

[dependencies]
libwoven = { path = "../libwoven" }
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.10"

smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
unicode-normalization = { version = "0.1.25", default-features = false }
poly1305 = { version = "0.7.2", features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
ed25519-compact = { version = "2.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
rsa = { version = "0.9.9", default-features = false, features = ["sha2"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
[lints.rust]
warnings = "deny"
