[unstable]
build-std = ["core"]

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=large",
    "-C", "link-arg=--script=../../apps/hello/link.x",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=--no-pie",
    "-C", "link-arg=--gc-sections",
]
