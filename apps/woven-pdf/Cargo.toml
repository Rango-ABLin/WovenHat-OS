[workspace]

[package]
name = "wovenhat-pdf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wovenhat-pdf"
path = "src/main.rs"
test = false

[features]
# Small CLI-only binary for the Stage 16.1 signed Ring-3 smoke gate.
# GUI builds continue to use the default feature set.
ring3-smoke = []

[dependencies]
libwoven = { path = "../../libwoven" }
miniz_oxide = { version = "0.9.1", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
