[workspace]
resolver = "3"
members = ["kernel", "libwoven"]
# Applications are excluded deliberately. They are freestanding Ring-3 ELF
# images with their own linker script and link flags, so a host-targeted
# workspace build must not try to compile them.
exclude = ["vendor/bootloader", "apps/hello", "apps/hello-gui"]

[patch.crates-io]
bootloader = { path = "vendor/bootloader" }

[features]
physical-probe = ["kernel/physical-probe"]
qemu-test = ["kernel/qemu-test"]
stage6-hotplug-test = ["qemu-test", "kernel/stage6-hotplug-test"]
network-test = ["qemu-test", "kernel/network-test"]
legacy-pic-test = ["qemu-test", "kernel/legacy-pic-test"]
stage10-4-test = ["qemu-test", "kernel/stage10-4-test"]
stage10-5-test = ["qemu-test", "kernel/stage10-5-test"]
stage10-6-test = ["qemu-test", "kernel/stage10-6-test"]
stage10-7-test = ["qemu-test", "kernel/stage10-7-test"]
stage10-8-test = ["qemu-test", "kernel/stage10-8-test"]
stage10-9-test = ["qemu-test", "kernel/stage10-9-test"]
stage11-1-test = ["qemu-test", "kernel/stage11-1-test"]
stage11-2-test = ["qemu-test", "kernel/stage11-2-test"]
stage11-3-test = ["qemu-test", "kernel/stage11-3-test"]
stage11-4-test = ["qemu-test", "kernel/stage11-4-test"]
stage11-5-test = ["qemu-test", "kernel/stage11-5-test"]
stage12-1-test = ["qemu-test", "kernel/stage12-1-test"]
stage12-2-test = ["qemu-test", "kernel/stage12-2-test"]
stage12-3-test = ["qemu-test", "kernel/stage12-3-test"]
stage12-4-test = ["qemu-test", "kernel/stage12-4-test"]
stage12-5-test = ["qemu-test", "kernel/stage12-5-test"]
stage13-1-test = ["qemu-test", "kernel/stage13-1-test"]
stage13-2-test = ["qemu-test", "kernel/stage13-2-test"]
stage13-3-test = ["qemu-test", "kernel/stage13-3-test"]
stage13-4-test = ["qemu-test", "kernel/stage13-4-test"]
stage13-5-test = ["qemu-test", "kernel/stage13-5-test"]
stage13-6-test = ["qemu-test", "kernel/stage13-6-test"]
stage13-7-test = ["qemu-test", "kernel/stage13-7-test"]
stage13-8-test = ["qemu-test", "kernel/stage13-8-test"]
stage13-9-test = ["qemu-test", "kernel/stage13-9-test"]
stage13-10-test = ["qemu-test", "kernel/stage13-10-test"]
stage14-1-test = ["network-test", "kernel/stage14-1-test"]
stage14-2-test = ["network-test", "kernel/stage14-1-test", "kernel/stage14-2-test"]
stage14-3-test = ["network-test", "kernel/stage14-3-test"]
stage14-4-test = ["network-test", "kernel/stage14-4-test"]
stage14-5-test = ["network-test", "kernel/stage14-5-test"]
stage14-5b-test = ["network-test", "kernel/stage14-5b-test"]
stage14-5c-test = ["network-test", "kernel/stage14-5c-test"]
stage14-5d-test = ["network-test", "kernel/stage14-5d-test"]
stage15-1-test = ["qemu-test", "kernel/stage15-1-test"]
stage15-2-test = ["qemu-test", "kernel/stage15-2-test"]
stage16-1-test = ["qemu-test", "kernel/stage16-1-test"]
stage17-1-test = ["qemu-test", "kernel/stage17-1-test"]
stage18-1-test = ["qemu-test", "kernel/stage18-1-test"]
stage18-2-test = ["qemu-test", "kernel/stage18-2-test"]
