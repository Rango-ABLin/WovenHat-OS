[package]
name = "libwoven"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["userspace-allocator"]
userspace-allocator = []

[dependencies]
# The same audited, freestanding SHA-256 the kernel uses for boot
# measurement; software-only so it needs no CPU feature detection.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
# Same versions as kernel/Cargo.toml's WPA2 PBKDF2-HMAC-SHA1 use, here for
# PBKDF2-HMAC-SHA256 account PIN hashing (see the `accounts` module).
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Full Unicode Bidirectional Algorithm (UAX #9), no_std + alloc capable.
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }

[lints.rust]
warnings = "deny"
