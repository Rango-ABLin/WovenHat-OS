  runtime-storage-pcie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: clippy,rust-src,llvm-tools-preview
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 ovmf
      - name: Stage 10.8-11.5 runtime 1/2/4-core acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          for stage in 10.8 10.9 11.1 11.2 11.3 11.4 11.5; do
            feature="stage${stage/./-}-test"
            cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features "$feature" -- -D warnings
            for cpu in 1 2 4; do
              python3 scripts/test-stage10-runtime.py --stage "$stage" --cpus "$cpu" --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
            done
          done
      - name: Stage 12.1-12.5 storage and filesystem 1/2/4-core acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          baseline_storage_sha="$(sha256sum kernel/src/storage_manager.rs | cut -d' ' -f1)"
          for stage in 12.1 12.2 12.3 12.4 12.5; do
            echo "::group::Stage $stage source integrity"
            current_storage_sha="$(sha256sum kernel/src/storage_manager.rs | cut -d' ' -f1)"
            if [ "$current_storage_sha" != "$baseline_storage_sha" ]; then
              echo "::error::storage_manager.rs changed during acceptance before Stage $stage"
              git diff -- kernel/src/storage_manager.rs
              exit 1
            fi
            nl -ba kernel/src/storage_manager.rs | sed -n '19,44p'
            echo "::endgroup::"
            feature="stage${stage/./-}-test"
            cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features "$feature" -- -D warnings
            for cpu in 1 2 4; do
              python3 scripts/test-stage10-runtime.py --stage "$stage" --cpus "$cpu" --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
            done
          done
      - name: Stage 13.1-13.2 driver and PCIe 1/2/4-core acceptance
        shell: bash
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          ovmf_code=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          test -n "$ovmf_code"
          for stage in 13.1 13.2; do
            feature="stage${stage/./-}-test"
            cargo clippy -p wovenhat-kernel --target x86_64-unknown-none --features "$feature" -- -D warnings
            for cpu in 1 2 4; do
              python3 scripts/test-stage10-runtime.py --stage "$stage" --cpus "$cpu" --timeout 180 --qemu "$qemu" --firmware "$ovmf_code"
            done
          done
      - name: Preserve runtime-storage-pcie evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-storage-pcie-evidence
          if-no-files-found: ignore
          path: |
            target/release-validation/
            audit-artifacts/
            target/*regression-*/serial.log
            target/*regression-*/qemu.log
            target/hello-gui-*/serial.log

