[workspace]

[package]
name = "wovenhat-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wovenhat-terminal"
path = "src/main.rs"
test = false

[dependencies]
libwoven = { path = "../../libwoven" }
wovenhat-calculator = { path = "../woven-calculator" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
