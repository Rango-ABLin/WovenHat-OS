# Its own workspace root: this crate links as a Ring-3 program and must not
# inherit the kernel workspace build settings.
[workspace]

[package]
name = "wovenhat-hello-gui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wovenhat-hello-gui"
path = "src/main.rs"

[dependencies]
libwoven = { path = "../../libwoven" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
