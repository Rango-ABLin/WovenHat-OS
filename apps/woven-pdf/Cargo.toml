[workspace]

[package]
name = "wovenhat-pdf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wovenhat-pdf"
path = "src/main.rs"
test = false

[dependencies]
libwoven = { path = "../../libwoven" }
miniz_oxide = { version = "0.9.1", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
