[package]
name = "libwoven"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["userspace-allocator"]
userspace-allocator = []
# WovenWeb runtime remains opt-in until the general kernel VM lease layer is qualified.
reclaiming-allocator = ["userspace-allocator"]

[dependencies]
# The same audited, freestanding SHA-256 the kernel uses for boot
# measurement; software-only so it needs no CPU feature detection.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
# Same versions as kernel/Cargo.toml's WPA2 PBKDF2-HMAC-SHA1 use, here for
# PBKDF2-HMAC-SHA256 account PIN hashing (see the `accounts` module).
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Full Unicode Bidirectional Algorithm (UAX #9), no_std + alloc capable.
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
# Pure-Rust no_std+alloc image decoders. SIMD and std integrations stay off so
# the same bounded codec boundary can build into Ring-3 images.
zune-core = { version = "0.5.3", default-features = false }
zune-jpeg = { version = "0.5.16-rc3", default-features = false }
zune-png = { version = "0.5.2", default-features = false }
zenwebp = { version = "=0.3.2", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
oxideav-webp = { version = "0.3.1", default-features = false }

[lints.rust]
warnings = "deny"
