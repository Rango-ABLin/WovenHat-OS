parameters = [
    { name = "fd", type = "u32", description = "File descriptor" },
    { name = "buffer", type = "usize", description = "User buffer pointer" },
    { name = "length", type = "u64", description = "Number of bytes to read" }
]

[syscalls.Write]
number = 1
description = "Write to a file descriptor"
