[unstable]
bindeps = true

# Keep compiler and test output off the source volume. Acceptance launchers
# use the same D: root, and repository-local target paths are junctioned there
# for scripts that intentionally isolate nested Cargo builds.
[build]
target-dir = "D:/WovenHat-OS-output/target"

# All acceptance builds must be reproducible from the checked-in lockfile and
# the local Cargo cache. Nested bootloader builds inherit this setting instead
# of attempting an unreviewed crates.io download.
[net]
offline = true
