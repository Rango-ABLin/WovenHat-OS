name: kernel

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-10
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: clippy,rust-src,llvm-tools-preview
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 ovmf
      - name: Lint, host regressions, and 1/2/4-core boot matrix
        run: |
          qemu=/usr/bin/qemu-system-x86_64
          echo "Installed OVMF firmware files:"
          find /usr/share/OVMF -maxdepth 1 -type f -name '*.fd' -printf '%f\n' | sort
          ovmf_code=
          ovmf_vars=
          for variant in OVMF_CODE_4M.fd OVMF_CODE.fd; do
            candidate="/usr/share/OVMF/$variant"
            [ -f "$candidate" ] || continue
            vars_name="${variant/CODE/VARS}"
            vars_candidate="/usr/share/OVMF/$vars_name"
            if [ -f "$vars_candidate" ]; then
              ovmf_code="$candidate"
              ovmf_vars="$vars_candidate"
              break
            fi
          done
          test -x "$qemu"
          if [ -z "$ovmf_code" ] || [ -z "$ovmf_vars" ]; then
            echo "::error::No matched OVMF CODE/VARS pair found"
            exit 1
          fi
          "$qemu" --version
          echo "OVMF CODE: $ovmf_code"
          echo "OVMF VARS: $ovmf_vars"
          sha256sum "$ovmf_code" "$ovmf_vars"
          python3 scripts/test-release.py --qemu "$qemu" --firmware "$ovmf_code" --firmware-vars "$ovmf_vars"
      - name: Stage 12.4 persistent rollback reboot recovery
        run: |
          python3 scripts/test-stage12-4-reboot.py \
            --qemu /usr/bin/qemu-system-x86_64 \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --firmware-vars /usr/share/OVMF/OVMF_VARS_4M.fd \
            --cpus 2
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: |
            target/release-validation/
            target/memory-regression-*/serial.log
            target/storage-regression-*/serial.log
            target/network-regression-*/serial.log
            target/network-regression-*/qemu.log
            target/stage12-4-reboot-*/
