name: WovenHat-OS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & QEMU Integration Test (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Add Target
        run: rustup target add x86_64-unknown-none

      - name: Build Kernel
        run: cargo build -p wovenhat-os --verbose

      - name: Run QEMU Integration Tests
        run: python3 scripts/test-shell-qemu.py --cpus 2 --memory 5G --firmware /usr/share/OVMF/OVMF_CODE_4M.fd
